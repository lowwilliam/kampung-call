<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Procedural Three.js studies of thirteen demolished Singapore landmarks." />
    <title>Lost Singapore — Heritage Buildings in Three.js</title>
    <script type="module" src="/src/lost-heritage-preview.js?v=20260812-2"></script>
  </head>
  <body>
    <main id="heritage-app">
      <section class="viewer-shell" aria-label="Interactive 3D reconstruction">
        <canvas id="heritage-canvas"></canvas>
        <div class="brand-lockup">
          <span class="eyebrow">A research-led procedural archive</span>
          <strong>Lost Singapore</strong>
        </div>
        <div class="model-readout" id="model-readout">Loading model…</div>
        <div class="view-controls" aria-label="Camera views">
          <button data-view="front">Front</button>
          <button data-view="three-quarter" class="active">3/4</button>
          <button data-view="side">Side</button>
          <button data-view="top">Top</button>
        </div>
        <label class="explode-control">
          <span>Exploded view</span>
          <input id="explode-slider" type="range" min="0" max="1" step="0.01" value="0" />
        </label>
      </section>

      <aside class="research-panel">
        <div>
          <span class="eyebrow">Thirteen places, 1907–2024</span>
          <h1 id="building-name">Lost Singapore</h1>
          <p class="subtitle" id="building-subtitle"></p>
        </div>
        <div class="timeline" id="timeline"></div>
        <p id="building-summary"></p>
        <div class="fact-grid" id="fact-grid"></div>
        <section class="selected-part" aria-live="polite">
          <span class="eyebrow">Selected model part</span>
          <strong id="selected-part">Click a building component</strong>
        </section>
        <section>
          <h2>Evidence &amp; reconstruction note</h2>
          <p id="model-disclosure"></p>
          <div id="source-links" class="source-links"></div>
        </section>
        <nav class="building-list" id="building-list" aria-label="Lost buildings"></nav>
      </aside>
    </main>
  </body>
</html>
